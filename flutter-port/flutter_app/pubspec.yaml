name: guardian
description: Guardian — tactical anti-theft intelligence suite.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / design
  # NOTE: Flutter 3.47 decoupled Material into `material_ui`; the in-SDK import
  # below still works and is formally deprecated in the Nov 2026 stable.
  # Migrate with: dart fix --apply --code=migrate_design_widgets
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # State / routing
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  go_router: ^16.0.0

  # Platform capabilities
  local_auth: ^3.0.2
  permission_handler: ^12.0.0
  geolocator: ^14.0.0
  flutter_secure_storage: ^10.0.0
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^19.0.0
  battery_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  sensors_plus: ^6.0.0

  # Data
  dio: ^5.7.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # AI
  firebase_core: ^3.6.0
  firebase_ai: ^2.0.0
  firebase_app_check: ^0.3.1
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  # Utils
  intl: ^0.19.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^7.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.20.0
  mocktail: ^1.0.4
  alchemist: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/illustrations/
    - assets/stickers/
    - assets/avatars/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
